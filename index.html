<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2efe7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="人格調律工房">
<meta name="description" content="AIチャット向けのキャラクター人格を、スライダーで具体的な行動規則に変換する設計ツール">
<title>キャラ人格調律工房</title>
<style>
:root{
  --bg:#f2efe7; --card:#fbfaf6; --ink:#24272e; --sub:#686b73; --faint:#8d9097; --line:#dcd7cb; --seg:#e8e4d9;
  --accent:#2d3f5e; --accent-ink:#f6f3ec; --accent-weak:#e2e6ee;
  --brass:#9a7b41; --brass-weak:#efe6d3;
  --warn:#80561c; --warn-bg:#f3e9d7; --ok:#3b6650; --ok-bg:#e1ebe4; --danger:#943a31; --danger-bg:#f3e1dd;
  --shadow:0 1px 2px rgba(20,24,32,.06);
  --hh:calc(52px + env(safe-area-inset-top, 0px));
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14161b; --card:#1c1f26; --ink:#e5e2da; --sub:#9b9da4; --faint:#7a7d85; --line:#2e323b; --seg:#252931;
    --accent:#8fa4c6; --accent-ink:#121a29; --accent-weak:#263044;
    --brass:#c4a66c; --brass-weak:#33301f;
    --warn:#e2b77a; --warn-bg:#352b1c; --ok:#8cc5a5; --ok-bg:#1d2e25; --danger:#f0a198; --danger-bg:#3a2321;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:env(safe-area-inset-top) 16px 0;border-bottom:1px solid var(--line)}
.hbar{height:51px;display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto}
h1{margin:0;font:600 17px/1 var(--serif);letter-spacing:.1em}
.ver{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:2px 10px;letter-spacing:.05em}
main{max-width:640px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
h2{font:600 16px/1.45 var(--serif);margin:0 0 6px;letter-spacing:.05em}
h3{font-size:15px;margin:0;font-weight:600}
h4{font-size:12.5px;margin:0 0 6px;color:var(--sub);font-weight:600;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.hint{font-size:12.5px;color:var(--sub);margin:2px 0 10px;line-height:1.65}
.hint.note{margin:8px 2px 0}
.field{margin-bottom:12px}
.field>label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px}
.txt{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.txt:focus{outline:2px solid var(--accent);outline-offset:-1px}
select.txt{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea.txt{resize:vertical;line-height:1.6}
.num{width:132px}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.unit{color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:8px 13px;font:inherit;font-size:14px;line-height:1.25;min-height:38px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 15px;font:inherit;font-size:14px;font-weight:600;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:13px;min-height:36px}
.btn svg.ic{width:17px;height:17px}
.seg{display:flex;background:var(--seg);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--sub);font:inherit;font-size:14px;padding:9px 2px;border-radius:8px;min-height:40px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.col{flex-direction:column}
.seg.col button{text-align:left;padding:10px 12px}
.stagebar{position:sticky;top:var(--hh);z-index:10;background:var(--bg);margin:0 -16px 12px;padding:8px 16px;border-bottom:1px solid var(--line)}
.stagebar .seg button.on{color:var(--accent);box-shadow:inset 0 -2px 0 var(--brass),0 1px 3px rgba(0,0,0,.12)}
.stagecap{font-size:11.5px;color:var(--sub);margin:0 2px 5px;display:flex;justify-content:space-between}
.stagecap b{color:var(--brass);font-weight:600}
/* カテゴリ */
details.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 12px;box-shadow:var(--shadow)}
details.cat>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;min-height:58px}
details.cat>summary::-webkit-details-marker{display:none}
.cat-t{flex:1;min-width:0}
.cat-t b{display:block;font:600 15.5px/1.35 var(--serif);letter-spacing:.05em}
.cat-t small{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.chev{transition:transform .2s;color:var(--sub)}
details[open]>summary .chev{transform:rotate(180deg)}
.cat-body{padding:0 16px 8px;border-top:1px solid var(--line)}
.badge{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;margin-left:4px;font-weight:600;vertical-align:1px}
.badge.lock{background:var(--brass-weak);color:var(--brass)}
.badge.jump{background:var(--warn-bg);color:var(--warn)}
/* 項目 */
.trait{padding:16px 0 14px;border-bottom:1px solid var(--line)}
.trait:last-child{border-bottom:0}
.trait-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lockbtn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:99px;padding:5px 12px;font:inherit;font-size:12.5px;min-height:34px}
.lockbtn svg.ic{width:15px;height:15px}
.lockbtn.on{background:var(--brass-weak);border-color:var(--brass);color:var(--brass);font-weight:600}
.scope{font-size:11.5px;color:var(--brass);border:1px solid var(--brass);border-radius:99px;padding:3px 10px}
.lvline{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--sub);margin-top:2px}
.lvline .lvname{color:var(--ink);font-weight:600;font-size:14px}
.trait.locked .lvline .lvname{color:var(--brass)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:4px 0 0;touch-action:pan-y;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-11px;border-radius:50%;background:var(--card);border:2px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.22)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.trait.locked input[type=range]::-webkit-slider-thumb{border-color:var(--brass)}
.ticks{display:flex;justify-content:space-between;margin:0 -4px}
.tick{width:36px;height:30px;border:0;background:transparent;color:var(--faint);font:inherit;font-size:12px;font-variant-numeric:tabular-nums;border-radius:8px}
.tick.on{color:var(--accent);font-weight:700}
.poles{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-top:-2px}
.rule{margin:10px 0 4px;font-size:13.5px;line-height:1.7;border-left:2px solid var(--brass);padding-left:11px}
.trans{margin:8px 0 0;font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center}
.trans .st b{margin-left:3px;color:var(--ink);font-weight:600}
.trans .st.cur b{color:var(--accent)}
.trans .arr{opacity:.45}
.jump{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:0 6px;font-size:11px;font-weight:600}
.trait.dim{opacity:.55}
.tag{display:inline-block;background:var(--seg);color:var(--sub);border-radius:6px;padding:2px 8px;font-size:11.5px}
.chk{font-size:13px;padding:9px 12px;border-radius:10px;margin-bottom:6px;line-height:1.6}
.chk.info{background:var(--accent-weak);color:var(--ink)}
.chk.warn{background:var(--warn-bg);color:var(--warn)}
.chk.ok{background:var(--ok-bg);color:var(--ok)}
.chk button{margin-left:6px}
.switchrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0;min-height:44px}
input.switch{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s;margin:0}
input.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
input.switch:checked{background:var(--accent)}
input.switch:checked::after{transform:translateX(20px)}
.sub-block{padding:14px 0;border-bottom:1px solid var(--line)}
.group{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.picker{margin-bottom:12px}
.picker>label{font-size:12.5px;color:var(--sub)}
.picker .txt{margin-top:8px}
.preset-desc{font-size:13px;line-height:1.7;background:var(--bg);border-radius:10px;padding:10px 12px;margin:10px 0 0}
.preset-desc b{font-weight:600}
.preset-desc small{display:block;color:var(--sub);margin-top:4px;font-size:12px}
.customs{list-style:none;margin:8px 0 0;padding:0}
.customs li{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:6px 6px 6px 12px;margin-bottom:6px;font-size:14px}
.x{border:0;background:transparent;color:var(--sub);font-size:20px;line-height:1;padding:6px 12px;min-height:36px}
.addrow{display:flex;gap:8px;margin-top:8px}
.rule-row{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.rr-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub);margin-bottom:4px}
.rule-row .mid{font-size:12.5px;color:var(--sub);margin:6px 0 4px}
details.plain summary{cursor:pointer;font-weight:600;font-size:14px;min-height:30px;list-style:none;display:flex;align-items:center;gap:6px}
details.plain summary::-webkit-details-marker{display:none}
details.plain[open] summary{margin-bottom:10px}
.pv-head{display:flex;justify-content:space-between;align-items:center}
.pv-head h3{font:600 15px/1.4 var(--serif);letter-spacing:.05em}
.pv-meta{font-size:12px;color:var(--sub);margin:4px 0 10px}
.pv-meta b{color:var(--ink);font-weight:600}
.pv-body p{margin:0 0 7px}
.pv-body .act{color:var(--sub);font-size:14px}
.pv-body .say{font-size:15.5px;line-height:1.8}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.note-box{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:8px 11px;margin:8px 0 0;line-height:1.6}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter .bar{height:100%;border-radius:4px;background:var(--ok);transition:width .2s}
.meter .bar.near{background:var(--brass)}
.meter .bar.over{background:var(--danger)}
.nums{display:flex;justify-content:space-around;text-align:center;margin:12px 0 6px}
.nums small{display:block;font-size:11.5px;color:var(--sub)}
.nums b{font-size:22px;font-variant-numeric:tabular-nums;font-weight:600}
.nums b.neg{color:var(--danger)}
.msg{font-size:13px;border-radius:10px;padding:9px 12px;margin:6px 0 0;line-height:1.6}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.near{background:var(--warn-bg);color:var(--warn)}
.msg.over{background:var(--danger-bg);color:var(--danger)}
.msg.na{background:var(--seg);color:var(--sub)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,"Hiragino Sans",monospace;font-size:13px;white-space:pre-wrap}
#md{height:340px}
#pvmd{height:240px}
.bd{list-style:none;margin:10px 0 0;padding:0;font-size:12.5px;color:var(--sub)}
.bd li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dotted var(--line)}
.oprow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.oprow .on-name{font-size:14px;font-weight:600}
.oprow .on-sub{font-size:12px;color:var(--sub)}
.oprow .seg{grid-column:1 / -1}
.oprow .seg button{font-size:12.5px;padding:6px 2px;min-height:34px}
.omit{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);min-height:36px}
.omit input{width:20px;height:20px;accent-color:var(--accent)}
.cand{font-size:11px;color:var(--brass);border:1px solid var(--brass);border-radius:6px;padding:0 6px;margin-left:4px;font-weight:600}
.row.gap{gap:8px;margin:10px 0}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;font-size:0;cursor:pointer}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav#tabs button{flex:1;border:0;background:none;padding:8px 0 7px;color:var(--faint);font:inherit;font-size:10.5px;letter-spacing:.03em;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;position:relative}
nav#tabs svg.ic{width:23px;height:23px;stroke-width:1.6}
nav#tabs button.on{color:var(--accent);font-weight:600}
nav#tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:0 0 2px 2px;background:var(--brass)}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:.95}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.5);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet p{margin:4px 0 12px;font-size:14px;color:var(--sub)}
</style>
</head>
<body>
<header><div class="hbar"><h1>キャラ人格調律工房</h1><span class="ver">v0.2</span></div></header>
<main id="app"></main>
<nav id="tabs" aria-label="画面切り替え"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="start" class="modal" hidden>
  <div class="sheet">
    <h2>はじめに</h2>
    <p>このキャラクターの人格設定に使う予定文字数を入力してください。世界観などを含む設定欄全体ではなく、このツールが出力する人格部分の文字数です。あとから変更できます。</p>
    <div class="row"><input id="start-budget" type="number" inputmode="numeric" class="txt num" value="2000" min="100" step="100"><span class="unit">字</span></div>
    <div class="chips" id="start-chips"></div>
    <div class="row" style="margin-top:16px"><button class="btn" data-act="start-ok">この文字数で始める</button><button class="btn ghost" data-act="start-skip">あとで決める</button></div>
  </div>
</div>
<noscript>このツールはJavaScriptを使います。</noscript>

<script>
'use strict';
/* =====================================================================
   キャラ人格調律工房 v0.2
   ---------------------------------------------------------------------
   構成
     1. 辞書   CATS / TRAITS / SPEECH / COND / ROMANCE_* / SITUATIONS
     2. 設定データ D（保存対象）・バージョン移行
     3. 人格Markdown（SECTIONS → buildMarkdown。D を変更しない純関数）
     4. 試着（発話意図 → 口調別テンプレート → 呼称の実体化）
     5. 画面とイベント

   拡張の目安
     ・人格の軸を追加   : TRAITS に1件（levels 5段階 + shift + def + cat）
     ・口調を追加       : SPEECH に1件。試着テンプレートは未定義なら「標準」で代替
     ・出力節を追加     : SECTIONS に {id,title,build(c)}
     ・試着の状況を追加 : SITUATIONS に1件（plan で意図を決め、slots で台詞を選ぶ）
   ===================================================================== */

const APP_VERSION = '0.2';
const DATA_VERSION = 2;
const STORAGE_KEY = 'persona-tuning-workshop:data';
const LEGACY_KEYS = ['kyara-tuning-workshop:v0.1'];
const UI_KEY = 'persona-tuning-workshop:ui';
const JUMP = 2; // 隣り合う段階でこの段数以上動くと「急変」
const STAGES = [
  {id:'initial', name:'初期', short:'初期'},
  {id:'trust',   name:'信頼成立後', short:'信頼後'},
  {id:'deep',    name:'関係深化後', short:'深化後'}
];
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const countChars = s => Array.from(s).length;           // Markdown記号・改行も1字
const clampLv = v => { v = Math.round(Number(v)); return isNaN(v) ? 3 : Math.max(1, Math.min(5, v)); };
const firstSentence = s => { const i = s.indexOf('。'); return i >= 0 ? s.slice(0, i + 1) : s; };

/* ---------- アイコン（Lucide風の線画。外部読み込みなし） ---------- */
const ICON = {
  tune:'<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/><circle cx="8" cy="6" r="2.2" fill="var(--card)"/><circle cx="15" cy="12" r="2.2" fill="var(--card)"/><circle cx="10" cy="18" r="2.2" fill="var(--card)"/>',
  relation:'<circle cx="6" cy="5.5" r="2.3"/><circle cx="6" cy="18.5" r="2.3"/><circle cx="18" cy="8" r="2.3"/><path d="M6 7.8v8.4"/><path d="M18 10.3c0 4.2-3.4 5.4-9.8 7.2"/>',
  preview:'<path d="M20.5 11.6a8.3 8.3 0 0 1-12.2 7.3L3.5 20.5l1.6-4.6A8.3 8.3 0 1 1 20.5 11.6z"/><line x1="8.5" y1="10.2" x2="15.5" y2="10.2"/><line x1="8.5" y1="13.6" x2="13" y2="13.6"/>',
  output:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><line x1="8.5" y1="13" x2="15.5" y2="13"/><line x1="8.5" y1="16.5" x2="13.5" y2="16.5"/>',

/* ---------- 試着の辞書 ----------
   各状況は
     plan(t)  : 人格パラメータ t から「発話意図」を先に決める
     slots    : 台詞・動作の枠。opts を上から見て when(t, i) を満たす最初の1つを使う
   t は {軸id: 1〜5, $stage: 0〜2, $rom: 恋愛モード}。恋愛専用の軸は恋愛なしなら null。
   台詞は口調ごとに書き分ける（S の引数順は SPEECH と同じ）。'' はその口調では言わない。
   呼称の書き方：
     {me} {you}         必ず入れる
     {me:は} {you:の}   助詞ごと任意。すでにその呼称が出ていれば省く（連呼を防ぐ）
     {voc} / {vocE}     呼びかけ（文頭「〜、」/ 文末「、〜」）。「あなた」系や既出なら省く */
const S = (std, polite, haughty, curt, gentle, airy, blunt, archaic) => ({std, polite, haughty, curt, gentle, airy, blunt, archaic});
const isOneOf = (v, ...xs) => xs.includes(v);

    meta:{name:'', budget:2000, budgetSet:false, notice:''},
    traits,
    // 口調：enabled=false なら common を全段階に使う。段階別は null（=共通）。OFFに戻しても段階別の値は保持
    speech:{enabled:false, common:'std', stages:{initial:null, trust:null, deep:null}},
    pron:{enabled:false,
      me:{common:'僕', initial:null, trust:null, deep:null},
      you:{common:'{{user}}', initial:null, trust:null, deep:null}},
    relation:{
      trust:{presets:['promise','listen','noJudge'], custom:[]},
      deepen:{presets:['confide','together'], custom:[]},
      regress:{presets:['brokenPromise','leak'], custom:[]},
      romance:{mode:'none', after:'hidden', presets:[], custom:[]},
      rules:[
        {when:'相手が泣いたとき', then:'何も言わず隣に座り、落ち着くまで待つ'},
        {when:'相手が嘘をついたとき', then:'怒鳴らず、黙って視線を外し、「本当のことを聞かせて」と静かに言う'}
      ]
    },
    output:{omit:[]}
  };
}
function deepMerge(base, saved){
  if(Array.isArray(base)) return Array.isArray(saved) ? saved : base;
  if(base && typeof base === 'object'){
    const out = {};
    for(const k of Object.keys(base)) out[k] = (saved && typeof saved === 'object' && k in saved) ? deepMerge(base[k], saved[k]) : base[k];
    // 既知の構造にないキー（ユーザー独自・将来の項目）も捨てない
    if(saved && typeof saved === 'object' && !Array.isArray(saved)) for(const k of Object.keys(saved)) if(!(k in out)) out[k] = saved[k];
    return out;
  }
  if(base === null) return (typeof saved === 'string' || saved === null) ? saved : base;
  return typeof saved === typeof base ? saved : base;
}
/* v0.1 → v0.2：0〜100 の値を、v0.1の5区分（0-19/20-39/40-59/60-79/80-100）でレベル1〜5へ */
const fromPercent = v => typeof v === 'number' ? Math.max(1, Math.min(5, Math.floor(v / 20) + 1)) : v;
const MIGRATIONS = {
  1(d){
    if(d.traits) for(const id of Object.keys(d.traits)){
      const t = d.traits[id]; if(!t || typeof t !== 'object') continue;
      t.common = fromPercent(t.common);
      if(t.stages) for(const s of Object.keys(t.stages)) t.stages[s] = fromPercent(t.stages[s]);
    }
    d.meta = d.meta || {};
    d.meta.notice = 'migrated';
    d.v = 2;
    return d;
  }
};
function migrate(raw){
  let d = JSON.parse(JSON.stringify(raw || {}));
  let v = Number(d.v) || 1;
  while(v < DATA_VERSION){
    if(!MIGRATIONS[v]) throw new Error('v' + v + ' からの移行方法がありません');
    d = MIGRATIONS[v](d); v = d.v;
  }
  return normalize(d);
}
function normalize(saved){
  const out = deepMerge(defaultData(), saved);
  for(const id of Object.keys(out.traits)){
    const t = out.traits[id]; if(!t || typeof t !== 'object') continue;
    if(TRAIT[id] || typeof t.common === 'number'){
      t.common = clampLv(t.common);
      if(t.stages) for(const s of STAGES) t.stages[s.id] = clampLv(t.stages[s.id] ?? t.common);
    }
  }
  if(!SPEECH_BY[out.speech.common]) out.speech.common = 'std';
  out.output.omit = (out.output.omit || []).filter(id => typeof id === 'string');
  out.v = DATA_VERSION;
  return out;
}
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return migrate(JSON.parse(raw));
    for(const k of LEGACY_KEYS){ // v0.1 の保存データを引き継ぐ（旧データは消さない）
      const old = localStorage.getItem(k);
      if(old) return migrate(JSON.parse(old));
    }
  }catch(e){}
  return defaultData();
}

/* ---------- 設定データの参照（D を引数に取り、出力生成を純関数に保つ） ---------- */
const isGlobal = id => !!(TRAIT[id] && TRAIT[id].scope === 'global');
const valOf = (D, id, stage) => {
  const t = D.traits[id]; if(!t) return 3;
  return (t.locked || isGlobal(id)) ? t.common : t.stages[stage];
};
const pronOf = (D, kind, stage) => {
  const p = D.pron[kind], dflt = kind === 'me' ? '僕' : '{{user}}';
  let v = D.pron.enabled ? p[stage] : p.common;
  if(v == null || String(v).trim() === '') v = p.common;
  if(v == null || String(v).trim() === '') v = dflt;
  return String(v).trim();
};
const speechOf = (D, stage) => {
  let v = D.speech.enabled ? D.speech.stages[stage] : null;
  if(!v || !SPEECH_BY[v]) v = D.speech.common;
  return SPEECH_BY[v] ? v : 'std';
};
const romOff = D => D.relation.romance.mode === 'none';
const prioOf = (D, id) => (D.traits[id] && D.traits[id].locked) ? 'high' : ((D.traits[id] && D.traits[id].prio) || (TRAIT[id] && TRAIT[id].prio) || 'normal');
const isDefaultTrait = (D, id) => {
  const t = D.traits[id], d = defaultTrait(TRAIT[id]);
  if(!t || t.locked) return false;
  if(isGlobal(id)) return t.common === d.common;
  return STAGES.every(s => t.stages[s.id] === d.stages[s.id]);
};
const changesAcross = (D, id) => { const t = D.traits[id]; return !t.locked && !isGlobal(id) && new Set(STAGES.map(s => t.stages[s.id])).size > 1; };
const val = (id, st) => valOf(D, id, st);

/* =====================================================================
   3. 人格Markdown（設定データ → 文章。D は変更しない）
   ===================================================================== */
const LEVEL_NAMES = {3:'詳細', 2:'標準', 1:'最小'};
// 詳細度 × 優先度 → 各規則の書き方。full=r+x / r=標準の言動 / core=最初の一文
const DETAIL = {3:{high:'full', normal:'full', low:'full'}, 2:{high:'full', normal:'r', low:'core'}, 1:{high:'r', normal:'core', low:'core'}};
const PRIO_NAMES = {high:'高', normal:'中', low:'低'};

function makeCtx(D, level){
  const c = {D, level, name:(D.meta.name || '').trim() || '{{char}}', omit:new Set(D.output.omit || [])};
  c.lv = (id, st) => valOf(D, id, st);
  c.pron = (kind, st) => pronOf(D, kind, st);
  c.rule = (id, l) => {
    const lv = TRAIT[id].levels[l - 1], mode = DETAIL[level][prioOf(D, id)];
    if(mode === 'full') return lv.r + lv.x;
    if(mode === 'r') return lv.r;
    return firstSentence(lv.r);
  };
  // 人格の節に載せる軸：全段階共通・恋愛専用・利用者が省略を選んだもの（固定は除く）は対象外
  c.inBody = t => !t.scope && !(c.omit.has(t.id) && !D.traits[t.id].locked);
  c.condItems = key => {
    const R = D.relation[key];
    const pre = R.presets.map(id => COND[key].find(x => x.id === id)).filter(Boolean).map(x => level >= 2 ? x.obs : x.label);
    return pre.concat(R.custom.map(s => String(s).trim()).filter(Boolean));
  };
  c.fmtList = (label, items, emptyText) => {
    if(!items.length) return `- ${label}：${emptyText}`;
    if(level >= 3) return `- ${label}：\n` + items.map(i => `  - ${i}`).join('\n');
    return `- ${label}：${items.join('／')}`;
  };
  return c;
}
function groupStages(fn){ // 連続する同じ値の段階をまとめる
  const out = [];
  STAGES.forEach(s => { const v = fn(s.id), last = out[out.length - 1]; if(last && last.v === v) last.st.push(s); else out.push({v, st:[s]}); });
  return out;
}

function buildMarkdown(D, level){
  const c = makeCtx(D, level);
  const parts = [];
  for(const sec of SECTIONS){
    const text = sec.build(c);
    if(text) parts.push({id:sec.id, title:sec.title, text});
  }
  const text = parts.map(p => p.text).join('\n\n');
  return {text, level, parts:parts.map(p => ({id:p.id, title:p.title, chars:countChars(p.text)}))};
}
// 詳細度：自動=予定文字数に収まる最も詳しいもの。収まらなければ最小を出して警告（項目の省略は利用者が選ぶ）
function chooseOutput(D, mode){
  const budget = D.meta.budget || 0;
  if(mode !== 'auto') return {...buildMarkdown(D, +mode), auto:false};
  let last = null;
  for(const lv of [3, 2, 1]){
    const r = buildMarkdown(D, lv); last = r;
    if(budget <= 0 || countChars(r.text) <= budget) return {...r, auto:true};
  }
  return {...last, auto:true};
}
// 省略できる項目と、省略した場合に減る文字数
function omitCandidates(D, level){
  const base = countChars(buildMarkdown(D, level).text);
  return TRAITS.filter(t => !t.scope && !D.traits[t.id].locked).map(t => {
    const omitted = (D.output.omit || []).includes(t.id);
    const copy = {...D, output:{omit: omitted ? D.output.omit.filter(x => x !== t.id) : [...(D.output.omit || []), t.id]}};
    const other = countChars(buildMarkdown(copy, level).text);
    return {id:t.id, omitted, saves: omitted ? other - base : base - other,
            suggested: prioOf(D, t.id) === 'low' && isDefaultTrait(D, t.id)};
  });
}

/* =====================================================================
   4. 試着（外部AIなし。意図 → 口調別テンプレート → 呼称の実体化）
   ===================================================================== */
function traitCtx(D, stageId){
  const t = {};
  TRAITS.forEach(x => { t[x.id] = valOf(D, x.id, stageId); });
  if(romOff(D)) TRAITS.forEach(x => { if(x.romance) t[x.id] = null; });
  t.$stage = STAGES.findIndex(s => s.id === stageId);
  t.$rom = D.relation.romance.mode;
  return t;
}
const NO_VOCATIVE = ['あなた','貴方','貴女','あなたさま'];
function tidy(s){
  return s.replace(/^[、\s]+/, '').replace(/([。？！」])、/g, '$1').replace(/、(?=[。？！」])/g, '').replace(/、、+/g, '、').replace(/。。+/g, '。');
}
function realize(items, me, you){
  let meUsed = false, youUsed = false;
  return items.map(it => {
    if(it.k !== 'say') return it;
    const text = it.text.replace(/\{(me|you)(?::([^}]*))?\}|\{(vocE|voc)\}/g, (m, who, part, voc) => {
      if(voc){
        if(youUsed || NO_VOCATIVE.includes(you)) return '';
        youUsed = true;
        return voc === 'voc' ? you + '、' : '、' + you;
      }
      const used = who === 'me' ? meUsed : youUsed;
      if(part !== undefined && used) return '';
      if(who === 'me') meUsed = true; else youUsed = true;
      return (who === 'me' ? me : you) + (part || '');
    });
    return {...it, text:tidy(text)};
  });
}
function pickText(say, preset){
  const v = say[preset];
  return v === undefined ? say.std : v; // 未定義の口調は標準で代替（辞書拡張時の保険）
}
function renderSituation(D, sit, stageId, withRomance, override){
  const t = traitCtx(D, stageId);
  const preset = (override && override.preset) || speechOf(D, stageId);
  const me  = (override && override.me)  || pronOf(D, 'me', stageId);
  const you = (override && override.you) || pronOf(D, 'you', stageId);
  const intent = sit.plan ? sit.plan(t) : {};
  const items = [];
  sit.slots.forEach(slot => {
    const opt = slot.opts.find(o => !o.when || o.when(t, intent));
    if(!opt) return;
    if(slot.k === 'act') items.push({k:'act', text:opt.act});
    else { const s = pickText(opt.say, preset); if(s) items.push({k:'say', text:s}); }
  });
  const Rm = D.relation.romance;
  if(withRomance && Rm.mode !== 'none'){
    if(Rm.after === 'open' && t.$stage === 0) items.push({k:'act', text:ROMANCE_ADDON.act.openEarly});
    else {
      items.push({k:'act', text:ROMANCE_ADDON.act[Rm.after] || ROMANCE_ADDON.act.hidden});
      if(Rm.after === 'open') items.push({k:'say', text:pickText(ROMANCE_ADDON.say, preset)});
      else if(t.romInitiative >= 4) items.push({k:'act', text:ROMANCE_ADDON.act.bold});
    }
  }
  const real = realize(items, me, you);
  const merged = [];
  real.forEach(it => {
    const prev = merged[merged.length - 1];
    if(it.k === 'say' && prev && prev.k === 'say') prev.text += (/[？！]$/.test(prev.text) ? '　' : '') + it.text;
    else if(it.k === 'act' && prev && prev.k === 'act') prev.text = prev.text.replace(/）$/, '') + '。' + it.text.replace(/^（/, '') ;
    else merged.push({...it});
  });
  const lines = merged.map(m => m.k === 'say' ? `「${m.text}」` : m.text);
  const notes = [];
  if((preset === 'polite' || preset === 'gentle' || preset === 'archaic') && ROUGH_YOU.includes(you))
    notes.push(`「${SPEECH_BY[preset].name}」の文体に、呼び方「${you}」を組み合わせています。意図したギャップならそのままで構いません。`);
  return {me, you, preset, intent, merged, lines, text:lines.join('\n'), notes};
}
function previewMarkdown(D, sits, withRomance, override){
  const name = (D.meta.name || '').trim() || '{{char}}';
  const out = [`# ${name}｜会話例`];
  sits.forEach(sit => {
    out.push(`\n## ${sit.name}\n状況：${sit.desc}`);
    STAGES.forEach(st => {
      const r = renderSituation(D, sit, st.id, withRomance, override);
      out.push(`### ${st.name}\n${r.text}`);
    });
  });
  return out.join('\n');
}

function saveUI(){ try{ localStorage.setItem(UI_KEY, JSON.stringify({open:UI.open})); }catch(e){} }
const BUDGETS = [800, 1200, 1600, 2000, 2400, 3000];

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1900);
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast('コピーしました'); return; }catch(e){}
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
  ta.remove(); toast(ok ? 'コピーしました' : 'コピーできませんでした。長押しで選択してください');
}
function download(filename, text, type){
  const blob = new Blob([text], {type:type + ';charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('ファイルを保存しました');
}
const fileBase = () => (((D.meta.name || '').replace(/[{}\\/:*?"<>|\s]+/g, '').trim()) || 'character');
function setPath(obj, path, v){
  const ks = path.split('.'); let o = obj;
  for(let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
  o[ks[ks.length - 1]] = v;
}

function catHTML(cat){

function catSummary(catId){
  const list = TRAITS.filter(t => t.cat === catId);
  const locked = list.filter(t => D.traits[t.id].locked).length;
  const jumps = list.filter(t => hasJump(t.id)).length;
  const base = CATS.find(c => c.id === catId).desc + `・${list.length}項目`;
  return esc(base) + (locked ? `<span class="badge lock">固定${locked}</span>` : '') + (jumps ? `<span class="badge jump">急変${jumps}</span>` : '');
}
const hasJump = id => {
  const d = D.traits[id]; if(!d || d.locked || isGlobal(id)) return false;
  for(let i = 1; i < STAGES.length; i++) if(Math.abs(d.stages[STAGES[i].id] - d.stages[STAGES[i - 1].id]) >= JUMP) return true;
  return false;
};
function traitHTML(t){
  const g = !!t.scope;
  return `<div class="trait" id="tc-${t.id}">
    <div class="trait-head"><h3>${esc(t.name)}</h3>${g ? '<span class="scope">全段階共通</span>' : `<button class="lockbtn" data-act="lock" data-trait="${t.id}"></button>`}</div>
    <div class="lvline"><span class="lvstage"></span><span class="lvname"></span></div>
    <input type="range" min="1" max="5" step="1" value="3" data-trait="${t.id}" aria-label="${esc(t.name)}">
    <div class="ticks">${[1,2,3,4,5].map(n => `<button class="tick" data-act="lv" data-trait="${t.id}" data-val="${n}" aria-label="${esc(t.name)} レベル${n}">${n}</button>`).join('')}</div>
    <div class="poles"><span>${esc(t.poles[0])}</span><span>${esc(t.poles[1])}</span></div>

    ${t.note ? `<p class="hint" style="margin:6px 0 0">${esc(t.note)}</p>` : ''}
    <p class="trans"></p>
  </div>`;
}
function transHTML(t){
  const d = D.traits[t.id];
  return STAGES.map((s, i) => {
    const v = d.stages[s.id], lab = t.levels[v - 1].label;
    const jump = i > 0 && Math.abs(v - d.stages[STAGES[i - 1].id]) >= JUMP;
    return `${i ? '<span class="arr">→</span>' : ''}${jump ? '<span class="jump">急変</span>' : ''}<span class="st ${s.id === UI.stage ? 'cur' : ''}">${s.short}<b>${esc(lab)}</b></span>`;
  }).join('');
}
function refreshTrait(id){
  const t = TRAIT[id], d = D.traits[id], card = $('#tc-' + id);
  if(!t || !card) return;
  const g = isGlobal(id), v = valOf(D, id, UI.stage);
  card.classList.toggle('locked', !!d.locked);
  card.classList.toggle('dim', !!(t.romance && romOff(D)));
  $('.lvstage', card).textContent = g ? `Lv${v}` : d.locked ? `Lv${v}・固定` : `${STAGES.find(s => s.id === UI.stage).name}  Lv${v}`;
  $('.lvname', card).textContent = t.levels[v - 1].label;
  const r = $('input[type=range]', card); r.value = v; r.style.setProperty('--p', ((v - 1) / 4 * 100) + '%');
  $$('.tick', card).forEach(b => b.classList.toggle('on', +b.dataset.val === v));
  $('.rule', card).textContent = t.levels[v - 1].r;
  const tr = $('.trans', card);
  if(t.romance && romOff(D)) tr.innerHTML = '<span class="tag">恋愛なし設定のため、出力・試着には使いません（値は保持）</span>';
  else if(g) tr.innerHTML = id === 'trustSpeed' ? '<span class="tag">「関係の進展」の進め方に反映</span>' : '<span class="tag">「信頼と恋愛感情」に反映</span>';
  else if(d.locked) tr.innerHTML = '<span class="tag">全段階で不変（核）</span>';
  else tr.innerHTML = transHTML(t);
  const lb = $('.lockbtn', card);
  if(lb){ lb.classList.toggle('on', !!d.locked); lb.innerHTML = d.locked ? ic('lock') + '固定中' : ic('unlock') + '固定'; lb.setAttribute('aria-pressed', String(!!d.locked)); }
}
function refreshCatSums(){ CATS.forEach(c => { const el = $('#catsum-' + c.id); if(el) el.innerHTML = catSummary(c.id); }); }
const refreshAllTraits = () => { TRAITS.forEach(t => refreshTrait(t.id)); refreshCatSums(); };

function checks(){
  const out = [], free = TRAITS.filter(t => !t.scope && !D.traits[t.id].locked), lockedN = TRAITS.filter(t => D.traits[t.id].locked).length;
  if(lockedN === 0) out.push({k:'info', t:'固定している項目がありません。関係が進んでも変わらない芯を1〜3項目固定すると、別人化を防げます。'});
  if(lockedN >= 8) out.push({k:'info', t:'固定が多いため、関係が進んでも振る舞いの変化が小さくなります。'});
  free.forEach(t => {
    const st = D.traits[t.id].stages;
    for(let i = 1; i < 3; i++){
      const a = st[STAGES[i - 1].id], b = st[STAGES[i].id];
      if(Math.abs(b - a) >= JUMP) out.push({k:'warn', t:`${t.name}：${STAGES[i - 1].name}→${STAGES[i].name}で Lv${a}→Lv${b} と2段階以上動いています。急に別人に見えやすい変化です。`});
    }
  });
  const big = free.filter(t => Math.abs(D.traits[t.id].stages.deep - D.traits[t.id].stages.initial) >= 2).length;
  if(big >= 6) out.push({k:'warn', t:`初期→関係深化後で2段階以上動く項目が${big}件あります。いくつかを固定するか、変化を小さくしてください。`});
  out.push(...speechConflicts().map(t => ({k:'info', t})));
  if(!out.length) out.push({k:'ok', t:'急変や矛盾の兆候はありません。'});
  return out;
}
function speechConflicts(){
  const msgs = [];
  groupStages(st => speechOf(D, st) + '|' + valOf(D, 'politeness', st)).forEach(g => {
    const [pid, pl] = g.v.split('|'), p = SPEECH_BY[pid];
    if(p.clash && p.clash.lv.includes(+pl)){
      const where = g.st.length === 3 ? '' : `（${g.st.map(s => s.name).join('・')}）`;
      msgs.push(`口調${where}：${p.clash.msg}意図したものなら問題ありません。`);
    }
  });
  return msgs;
}
function updateChecks(){
  const el = $('#checks'); if(!el) return;
  el.innerHTML = checks().map(c => `<div class="chk ${c.k}">${esc(c.t)}</div>`).join('');
}

/* ---------- 画面2：関係性・反応 ---------- */
function condBlock(key){
  const R = D.relation[key];
  const chips = COND[key].map(c => `<button class="chip ${R.presets.includes(c.id) ? 'on' : ''}" data-act="cond-toggle" data-key="${key}" data-id="${c.id}">${esc(c.label)}</button>`).join('');
  const customs = R.custom.map((c, i) => `<li><span>${esc(c)}</span><button class="x" data-act="cond-del" data-key="${key}" data-i="${i}" aria-label="削除">×</button></li>`).join('');
  return `<div class="chips">${chips}</div>
    <ul class="customs">${customs}</ul>
    <div class="addrow"><input type="text" class="txt" id="add-${key}" placeholder="自分で条件を追加" autocomplete="off"><button class="btn" data-act="cond-add" data-key="${key}">追加</button></div>`;
}
function viewRelation(){
  const Rm = D.relation.romance, ts = val('trustSpeed', 'initial');
  const modes = ROMANCE_MODES.map(m => `<button class="${Rm.mode === m.id ? 'on' : ''}" data-act="rom-mode" data-val="${m.id}">${m.label}</button>`).join('');
  const afters = ROMANCE_AFTER.map(a => `<button class="${Rm.after === a.id ? 'on' : ''}" data-act="rom-after" data-val="${a.id}">${a.label}</button>`).join('');
  const rules = D.relation.rules.map((r, i) => `
    <div class="rule-row">
      <div class="rr-head"><span>もし</span><button class="x" data-act="rule-del" data-i="${i}" aria-label="削除">×</button></div>

    <p class="hint">信頼が深まっても恋愛感情が生まれるとは限らず、逆も同じです。「恋愛感情は持たない」では、愛情表現・嫉妬・独占志向は友情の範囲で扱い、恋愛への積極性は使いません。</p>

    <p class="hint">人格設定のMarkdownとは別の書き出しです。キャラクターの「会話例」欄などに使えます。</p>
    <div class="seg" style="margin-bottom:10px">${[['one','この状況'],['all','全状況']].map(([v,n]) => `<button class="${UI.pvScope === v ? 'on' : ''}" data-act="pv-scope" data-val="${v}">${n}</button>`).join('')}</div>
    <textarea id="pvmd" class="txt mono" readonly></textarea>
    <p class="hint" id="pvmd-count" style="margin:6px 0 8px"></p>
    <div class="row wrap"><button class="btn sm" data-act="pvmd-copy">${ic('copy')}コピー</button><button class="btn ghost sm" data-act="pvmd-dl">${ic('download')}.mdで保存</button></div>
  </details>
  <p class="hint note">外部AIを使わない簡易プレビューです。性格の値から発話の意図を決め、口調ごとに書き分けた台詞テンプレートを選んでいます。この画面は設定を書き換えません。</p>`;
}
function previewCards(sit){
  return STAGES.map(st => {
    const r = renderSituation(D, sit, st.id, UI.romance, pvOverride());
    const body = r.merged.map(m => `<p class="${m.k}">${esc(m.k === 'say' ? `「${m.text}」` : m.text)}</p>`).join('') || '<p class="act">（この状況の反応がありません）</p>';
    const tags = sit.uses.filter(id => D.traits[id] && !(TRAIT[id].romance && romOff(D))).map(id => `<span class="tag">${esc(TRAIT[id].name)}：${esc(TRAIT[id].levels[val(id, st.id) - 1].label)}</span>`).join('');
    return `<section class="card pv">
      <div class="pv-head"><h3>${st.name}</h3><button class="btn ghost sm" data-act="copy-ex" data-stage="${st.id}">${ic('copy')}コピー</button></div>
      <div class="pv-meta">一人称 <b>${esc(r.me)}</b> ／ 二人称 <b>${esc(r.you)}</b> ／ 口調 <b>${esc(SPEECH_BY[r.preset].name)}</b></div>
      <div class="pv-body">${body}</div>
      <div class="tags">${tags}</div>
      ${r.notes.map(n => `<p class="note-box">${esc(n)}</p>`).join('')}
    </section>`;
  }).join('');
}
function updatePreviewMD(){
  const box = $('#pvmd'); if(!box) return;
  const sits = UI.pvScope === 'all' ? SITUATIONS : [SITUATIONS.find(s => s.id === UI.sit) || SITUATIONS[0]];
  box.value = previewMarkdown(D, sits, UI.romance, pvOverride());
  $('#pvmd-count').textContent = `${countChars(box.value)}字（改行・記号を含む）`;
}
function refreshPreviewCards(){
  const el = $('#pv-cards'); if(!el) return;
  el.innerHTML = previewCards(SITUATIONS.find(s => s.id === UI.sit) || SITUATIONS[0]);
  updatePreviewMD();
}

/* ---------- 画面4：Markdown出力 ---------- */
function viewOutput(){
  const lv = [['auto','自動'],['3','詳細'],['2','標準'],['1','最小']].map(([v, n]) => `<button class="${String(UI.level) === v ? 'on' : ''}" data-act="level" data-val="${v}">${n}</button>`).join('');
  return `
  <section class="card">
    <div class="field" style="margin-bottom:0"><label for="o-budget">人格設定の予定文字数</label>
      <div class="row"><input id="o-budget" type="number" inputmode="numeric" class="txt num" value="${D.meta.budget}" data-path="meta.budget" min="0" step="100"><span class="unit">字</span></div>
      <div class="chips">${budgetChips()}</div></div>
    <h4 style="margin-top:16px">出力の詳細度</h4>
    <div class="seg" id="o-level">${lv}</div>
    <p class="hint" style="margin:8px 0 0">詳細＝全項目に補足の言動まで ／ 標準＝優先度「中」は標準の言動、「低」は中核の一文 ／ 最小＝「高」以外は中核の一文。どの詳細度でも項目は削りません。</p>
  </section>
  <section class="card" id="counter"></section>
  <section class="card">
    <div class="row between" style="margin-bottom:10px"><h2 style="margin:0">人格設定 Markdown</h2></div>
    <textarea id="md" class="txt mono" readonly></textarea>
    <div class="row wrap" style="margin-top:10px"><button class="btn" data-act="copy-md">${ic('copy')}コピー</button><button class="btn ghost" data-act="dl-md">${ic('download')}.mdで保存</button></div>
    <ul class="bd" id="breakdown"></ul>
  </section>
  <details class="card plain" id="omit-box"><summary>${ic('chevron')}項目ごとの出力設定（優先度・省略）<span class="tag" id="omit-count" style="margin-left:6px"></span></summary>
    <p class="hint">優先度は詳細度ごとの書き方に効きます。「省略する」は利用者が選んだ項目だけを出力から外し、設定データは消しません。<span class="cand">候補</span>は優先度「低」で初期値のままの項目です。固定した核は省略できません。</p>
    <div class="row wrap" style="margin-bottom:6px"><button class="btn ghost sm" data-act="omit-suggested">候補をまとめて省略</button><button class="btn ghost sm" data-act="omit-clear">省略をすべて解除</button></div>
    <div id="omit-list"></div>
  </details>
  <details class="card plain"><summary>${ic('chevron')}設定データの保存・復元（JSON）</summary>
    <p class="hint">設定はこの端末のブラウザに自動保存されます。iPhoneのSafariは長く開かないと保存内容が消えることがあるため、ときどきJSONで控えを取ってください。v0.1のJSONも読み込めます。</p>
    <div class="row wrap gap"><button class="btn ghost sm" data-act="data-copy">${ic('copy')}JSONをコピー</button><button class="btn ghost sm" data-act="data-dl">${ic('download')}JSONを保存</button>
      <label class="btn ghost sm filebtn">${ic('upload')}JSONファイルを読み込む<input type="file" accept=".json,application/json,text/plain" data-act-change="data-file"></label></div>
    <textarea id="import-box" class="txt" rows="4" placeholder="ここにJSONを貼り付けて「貼り付けから読み込む」"></textarea>
    <div class="row wrap gap"><button class="btn sm" data-act="data-import">貼り付けから読み込む</button><button class="btn ghost sm" data-act="data-reset">初期化</button></div>
  </details>`;
}
let lastOutput = null;
function updateOutput(){
  const counter = $('#counter'); if(!counter) return;
  const r = chooseOutput(D, UI.level); lastOutput = r;
  const budget = D.meta.budget || 0, used = countChars(r.text), rem = budget - used;
  const ratio = budget > 0 ? used / budget : 0;
  const cls = budget <= 0 ? 'na' : (used > budget ? 'over' : (ratio >= 0.9 ? 'near' : 'ok'));
  let msg, action = '';
  if(cls === 'na') msg = '予定文字数を入力すると、収まるように詳細度を自動で選びます。';
  else if(cls === 'over'){
    msg = `予定文字数を${-rem}字超えています。` + (r.auto && r.level === 1 ? '最小の詳細度でも収まりませんでした。' : '') + '設定データは削除していません。省略する項目を選ぶか、条件・If-Thenを減らすか、予定文字数を見直してください。';
    action = '<button class="btn sm" data-act="open-omit" style="margin-top:8px">省略する項目を確認する</button>';
  }
  else if(cls === 'near') msg = `上限に近づいています（残り${rem}字）。`;
  else msg = '予定文字数に収まっています。';
  const modeTxt = r.auto ? `自動選択：${LEVEL_NAMES[r.level]}` : `手動：${LEVEL_NAMES[r.level]}`;
  const nOmit = (D.output.omit || []).filter(id => TRAIT[id] && !D.traits[id].locked).length;
  counter.innerHTML = `
    <div class="meter"><div class="bar ${cls}" style="width:${Math.min(100, ratio * 100)}%"></div></div>
    <div class="nums"><div><small>指定</small><b>${budget || '—'}</b></div><div><small>実際</small><b id="used-n">${used}</b></div><div><small>残り</small><b class="${rem < 0 && budget > 0 ? 'neg' : ''}">${budget > 0 ? rem : '—'}</b></div></div>
    <div class="msg ${cls}">${esc(msg)}${action}</div>
    <p class="hint" style="margin:8px 0 0">詳細度（${esc(modeTxt)}）${nOmit ? `／ 省略中 ${nOmit}項目` : ''} ／ 改行・記号も1字として数えています。</p>`;
  $('#md').value = r.text;
  $('#breakdown').innerHTML = r.parts.map(p => `<li><span>${esc(p.title)}</span><span>${p.chars}字</span></li>`).join('');
  updateOmitList(r.level);
}
function updateOmitList(level){
  const box = $('#omit-list'); if(!box) return;
  const cands = omitCandidates(D, level);
  const byId = Object.fromEntries(cands.map(c => [c.id, c]));
  $('#omit-count').textContent = `省略 ${cands.filter(c => c.omitted).length}件`;
  box.innerHTML = TRAITS.filter(t => !t.scope).map(t => {
    const d = D.traits[t.id], c = byId[t.id], p = prioOf(D, t.id);
    const stateTxt = d.locked ? '核（固定）' : changesAcross(D, t.id) ? STAGES.map(s => TRAIT[t.id].levels[d.stages[s.id] - 1].label).join('→') : t.levels[d.stages.initial - 1].label;
    const seg = d.locked ? '<span class="hint" style="grid-column:1 / -1;margin:0">固定した核は常に優先度「高」で出力します。</span>'
      : `<div class="seg">${['high','normal','low'].map(k => `<button class="${p === k ? 'on' : ''}" data-act="prio" data-trait="${t.id}" data-val="${k}">優先度 ${PRIO_NAMES[k]}</button>`).join('')}</div>`;
    const omit = d.locked ? '' : `<label class="omit"><input type="checkbox" data-act-change="omit" data-trait="${t.id}" ${c && c.omitted ? 'checked' : ''}>省略する${c ? `（${c.omitted ? '+' : '−'}${c.saves}字）` : ''}</label>`;
    return `<div class="oprow"><div><div class="on-name">${esc(t.name)}${c && c.suggested ? '<span class="cand">候補</span>' : ''}</div><div class="on-sub">${esc(stateTxt)}</div></div>${omit}${seg}</div>`;
  }).join('');
}

/* ---------- 描画 ---------- */
const VIEWS = {tune:viewTune, relation:viewRelation, preview:viewPreview, output:viewOutput};
function render(keep){
  const y = keep ? window.scrollY : 0;
  $('#app').innerHTML = VIEWS[UI.tab]();
  $$('#tabs button').forEach(b => { const on = b.dataset.tab === UI.tab; b.classList.toggle('on', on); b.setAttribute('aria-current', on ? 'page' : 'false'); });
  if(UI.tab === 'tune'){ refreshAllTraits(); updateChecks(); }
  if(UI.tab === 'output') updateOutput();
  if(UI.tab === 'preview') updatePreviewMD();
  window.scrollTo(0, y);
}
function rerenderSpeech(){
  const el = $('#speech-card'); if(el) el.outerHTML = speechHTML();
  updateChecks();
}

/* ---------- イベント ---------- */
function setLevel(id, v){
  const d = D.traits[id]; v = clampLv(v);
  if(d.locked || isGlobal(id)){ d.common = v; if(isGlobal(id)) STAGES.forEach(s => d.stages[s.id] = v); }
  else d.stages[UI.stage] = v;
  save(); refreshTrait(id); refreshCatSums(); updateChecks();
}
const ACTIONS = {
  tab(b){ UI.tab = b.dataset.tab; render(false); },
  stage(b){ UI.stage = b.dataset.stage; $$('.stagebar .seg button').forEach(x => x.classList.toggle('on', x.dataset.stage === UI.stage)); $('#stage-now').textContent = STAGES.find(s => s.id === UI.stage).name; refreshAllTraits(); },
  lv(b){ setLevel(b.dataset.trait, +b.dataset.val); },
  lock(b){
    const id = b.dataset.trait, d = D.traits[id];
    if(!d.locked) d.common = d.stages[UI.stage]; // 固定する時点の値を共通値にする（段階別の値は残る）
    d.locked = !d.locked; save(); refreshTrait(id); refreshCatSums(); updateChecks();
  },
  'notice-ok'(){ D.meta.notice = ''; save(); render(true); },
  'budget-chip'(b){ D.meta.budget = +b.dataset.val; D.meta.budgetSet = true; save(); render(true); },
  'speech-pick'(b){ D.speech.common = b.dataset.val; save(); rerenderSpeech(); },
  'pron-pick'(b){ D.pron[b.dataset.kind][b.dataset.slot] = b.dataset.val; save(); $('#pron-body').innerHTML = pronBodyHTML(); },
  'cond-toggle'(b){
    const R = D.relation[b.dataset.key], i = R.presets.indexOf(b.dataset.id);
    if(i >= 0) R.presets.splice(i, 1); else R.presets.push(b.dataset.id);
    save(); b.classList.toggle('on', i < 0);
  },
  'cond-add'(b){ addCustom(b.dataset.key); },
  'cond-del'(b){ D.relation[b.dataset.key].custom.splice(+b.dataset.i, 1); save(); render(true); },
  'rom-mode'(b){ D.relation.romance.mode = b.dataset.val; if(b.dataset.val === 'none') UI.romance = false; save(); render(true); },
  'rom-after'(b){ D.relation.romance.after = b.dataset.val; save(); render(true); },
  'rule-add'(){ D.relation.rules.push({when:'', then:''}); save(); render(true); },
  'rule-del'(b){ D.relation.rules.splice(+b.dataset.i, 1); save(); render(true); },
  'rule-ex'(b){ const e = IFTHEN_EXAMPLES[+b.dataset.i]; D.relation.rules.push({when:e.when, then:e.then}); save(); render(true); toast('追加しました'); },
  sit(b){ UI.sit = b.dataset.id; render(true); },
  'copy-ex'(b){ copyText(renderSituation(D, SITUATIONS.find(s => s.id === UI.sit) || SITUATIONS[0], b.dataset.stage, UI.romance, pvOverride()).text); },
  'pv-apply'(){
    const ov = pvOverride();
    if(ov.preset){ D.speech.common = ov.preset; }
    if(ov.me){ D.pron.me.common = ov.me; }
    if(ov.you){ D.pron.you.common = ov.you; }
    UI.pvPreset = UI.pvMe = UI.pvYou = '';
    save(); render(true); toast('共通の口調・呼称に反映しました');
  },
  'pv-clear'(){ UI.pvPreset = UI.pvMe = UI.pvYou = ''; render(true); },
  'pv-scope'(b){ UI.pvScope = b.dataset.val; $$('#pvmd-box .seg button').forEach(x => x.classList.toggle('on', x.dataset.val === UI.pvScope)); updatePreviewMD(); },
  'pvmd-copy'(){ copyText($('#pvmd').value); },
  'pvmd-dl'(){ download(`${fileBase()}_会話例.md`, $('#pvmd').value, 'text/markdown'); },
  level(b){ UI.level = b.dataset.val; $$('#o-level button').forEach(x => x.classList.toggle('on', x.dataset.val === UI.level)); updateOutput(); },
  'copy-md'(){ copyText($('#md').value); },
  'dl-md'(){ download(`${fileBase()}_人格設定.md`, $('#md').value, 'text/markdown'); },
  'open-omit'(){ const d = $('#omit-box'); d.open = true; d.scrollIntoView({behavior:'smooth', block:'start'}); },
  prio(b){ D.traits[b.dataset.trait].prio = b.dataset.val; save(); updateOutput(); },
  'omit-suggested'(){
    const add = omitCandidates(D, lastOutput ? lastOutput.level : 2).filter(c => c.suggested).map(c => c.id);
    D.output.omit = Array.from(new Set([...(D.output.omit || []), ...add])); save(); updateOutput();
    toast(add.length ? `${add.length}項目を省略に追加しました` : '候補はありません');
  },
  'omit-clear'(){ D.output.omit = []; save(); updateOutput(); },
  'data-copy'(){ copyText(JSON.stringify(D)); },
  'data-dl'(){ saveNow(); download(`${fileBase()}_persona.json`, JSON.stringify(D, null, 2), 'application/json'); },
  'data-import'(){
    const raw = $('#import-box').value.trim(); if(!raw){ toast('JSONを貼り付けてください'); return; }
    importJSON(raw);
  },
  'data-reset'(){
    if(!confirm('すべての設定を初期状態に戻します。よろしいですか？（先にJSONを保存しておくと安心です）')) return;
    D = defaultData(); D.meta.budgetSet = true; saveNow(); toast('初期化しました'); render(false);
  },
  'start-ok'(){
    const n = parseInt($('#start-budget').value, 10);
    D.meta.budget = (isNaN(n) || n <= 0) ? 2000 : n; D.meta.budgetSet = true; save(); closeStart(); render(false);
  },
  'start-skip'(){ D.meta.budgetSet = true; save(); closeStart(); },
  'start-chip'(b){ $('#start-budget').value = b.dataset.val; }
};
function importJSON(raw){
  try{
    const obj = JSON.parse(raw);
    if(!obj || typeof obj !== 'object' || !obj.traits) throw new Error('人格調律工房のデータではありません');
    if(!confirm(`現在の設定を、読み込んだ内容（v${obj.v || 1}形式）で置き換えます。よろしいですか？`)) return;
    D = migrate(obj); D.meta.budgetSet = true; saveNow(); toast('読み込みました'); render(false);
  }catch(e){ toast('読み込めませんでした：' + e.message); }
}
const CHANGES = {
  'pron-enabled'(el){ D.pron.enabled = el.checked; save(); $('#pron-card').innerHTML = pronHTML(); },
  'speech-enabled'(el){ D.speech.enabled = el.checked; save(); rerenderSpeech(); },
  'speech-stage'(el){ D.speech.stages[el.dataset.stage] = el.value || null; save(); updateChecks(); },
  'rom-preview'(el){ UI.romance = el.checked; refreshPreviewCards(); },
  'pv-preset'(el){ UI.pvPreset = el.value; refreshPreviewCards(); },
  omit(el){
    const id = el.dataset.trait, set = new Set(D.output.omit || []);
    if(el.checked) set.add(id); else set.delete(id);
    D.output.omit = Array.from(set); save(); updateOutput();
  },
  'data-file'(el){
    const f = el.files && el.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => { importJSON(String(rd.result)); el.value = ''; };
    rd.onerror = () => toast('ファイルを読み込めませんでした');
    rd.readAsText(f);
  }
};
function addCustom(key){
  const inp = $('#add-' + key); if(!inp) return;
  const v = inp.value.trim(); if(!v) return;
  D.relation[key].custom.push(v); save(); render(true);
}
function onBind(el){
  const path = el.dataset.path; let v = el.value;
  if(path === 'meta.budget'){ v = parseInt(v, 10); if(isNaN(v) || v < 0) v = 0; D.meta.budgetSet = true; }
  else if(/^pron\.(me|you)\.(initial|trust|deep)$/.test(path) && v.trim() === '') v = null;
  setPath(D, path, v); save();
  if(path.startsWith('pron.')){
    const pk = el.closest('.picker'); if(pk){
      const cur = D.pron[pk.dataset.kind][pk.dataset.slot] ?? D.pron[pk.dataset.kind].common;
      $$('.chip', pk).forEach(c => c.classList.toggle('on', c.dataset.val === cur));
    }
  }
  if(path === 'meta.budget'){
    if(UI.tab === 'output') updateOutput();
    $$('[data-act=budget-chip]').forEach(c => c.classList.toggle('on', +c.dataset.val === v));
  }
}
function closeStart(){ $('#start').hidden = true; }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const h = ACTIONS[b.dataset.act]; if(h) h(b, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.matches('input[type=range][data-trait]')) return setLevel(el.dataset.trait, +el.value);
  if(el.dataset && el.dataset.pv){ UI[el.dataset.pv] = el.value; refreshPreviewCards(); return; }
  if(el.dataset && el.dataset.path) onBind(el);
});
document.addEventListener('change', e => {
  const h = e.target.dataset && CHANGES[e.target.dataset.actChange]; if(h) h(e.target);
});
document.addEventListener('toggle', e => {
  const d = e.target; if(!d.matches || !d.matches('details.cat')) return;
  UI.open[d.dataset.cat] = d.open; saveUI();
}, true);
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.id && e.target.id.startsWith('add-')){ e.preventDefault(); addCustom(e.target.id.slice(4)); }
});
window.addEventListener('pagehide', saveNow);

/* ---------- 起動 ---------- */
(function init(){
  $('#start-chips').innerHTML = BUDGETS.map(n => `<button class="chip" data-act="start-chip" data-val="${n}">${n}</button>`).join('');
  render(false);
  if(!D.meta.budgetSet) $('#start').hidden = false;
})();
</script>
</body>
</html>
